<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nexvora Cloud - Your personal cloud file manager.">
  <title>Nexvora Cloud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: #f4f7ff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 650px; text-align: center; }
    .logo { color: #58a6ff; font-size: 15px; letter-spacing: 4px; }
    h1 { font-size: clamp(42px, 9vw, 68px); margin: 20px 0; }
    p { color: #aab6ca; line-height: 1.8; }
    nav { margin-top: 32px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    a { color: #70b7ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 65px; color: #66748c; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">NEXVORA</div>
    <h1>Nexvora Cloud</h1>
    <p>Your files, organized in one place.</p>
    <p>Nexvora Cloud is a cloud file management application designed to help users access and manage files they choose to open or create.</p>
    <nav>
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </nav>
    <footer>© 2026 Nexvora Cloud. All rights reserved.</footer>
  </main>

</html>
